<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Apps Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Design System & Variables --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #cff4fc 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #4a4e69;
            --text-muted: #7d7482;
            
            /* Pastel Palette */
            --pastel-pink: #ffcad4;
            --pastel-peach: #f4acb7;
            --pastel-green: #b5e2fa;
            --pastel-blue: #90e0ef;
            --pastel-purple: #e2afff;
            --pastel-yellow: #faedcd;
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 8px 24px rgba(154, 140, 152, 0.12);
            --transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- Global Resets & Typography --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Header & Blurb Section --- */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 2px solid white;
        }

        h1 {
            font-size: 3rem;
            color: #ff7096;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0px #ffe5ec;
        }

        .blurb {
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 750px;
            margin: 0 auto 1.5rem auto;
            color: var(--text-main);
        }

        .cta-highlight {
            font-weight: 700;
            color: #2a9d8f;
            display: inline-block;
            padding: 0.25rem 0.7rem;
            background: #b5e2fa60;
            border-radius: 12px;
        }

        .disclaimer {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            border-top: 1px dashed #ffcad4;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        /* --- Grid Layout Architecture (4 per row on desktop) --- */
        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            width: 100%;
        }

        /* --- App Card Styles --- */
        .app-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 2rem 1.25rem;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }

        .app-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(154, 140, 152, 0.2);
            background: rgba(255, 255, 255, 0.95);
        }

        /* Icon Wrapper */
        .icon-wrapper {
            width: 75px;
            height: 75px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            transition: var(--transition);
        }

        .app-card:hover .icon-wrapper {
            transform: scale(1.1) rotate(5deg);
        }

        .icon-shape {
            font-size: 2.25rem;
            user-select: none;
        }

        .app-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .app-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        /* Bubbly Button Link */
        .card-btn {
            background: #ff7096;
            color: white;
            font-weight: 700;
            padding: 0.6rem 1.5rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(255, 112, 150, 0.25);
            width: 80%;
        }

        .app-card:hover .card-btn {
            background: #ff477e;
            box-shadow: 0 6px 15px rgba(255, 112, 150, 0.4);
            width: 90%;
        }

        /* --- Responsive Viewports --- */
        @media (max-width: 1024px) {
            .showcase-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .showcase-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .showcase-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 1.5rem 0.5rem;
            }
            header {
                padding: 1.75rem 1rem;
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Web Apps Showcase</h1>
            <p class="blurb">
                This collection highlights tools built using a blend of <strong>human intelligence</strong> and <strong>AI</strong> frameworks to achieve clean, practical digital workflows. <span class="cta-highlight">You can have apps like these working for you!</span>
            </p>
            <div class="disclaimer">
                <strong>Disclaimer:</strong> Hobby use only at this stage.
            </div>
        </header>

        <main class="showcase-grid" id="grid-container">
            </main>
    </div>

    <script>
        // High-accuracy application naming and iconography registry
        const showcaseApps = [
            { title: "Invoice Generator", desc: "Instantly create, itemize, and format professional customer invoices online.", icon: "🧾", bg: "var(--pastel-pink)", url: "https://example.com/invoice-generator" },
            { title: "Weather Dashboard", desc: "Real-time local forecasts, atmospheric conditions, and weekly outlooks.", icon: "🌤️", bg: "var(--pastel-blue)", url: "https://example.com/weather-dashboard" },
            { title: "Task Manager", desc: "Organize workflows, establish deadlines, and check off completed targets.", icon: "📋", bg: "var(--pastel-yellow)", url: "https://example.com/task-manager" },
            { title: "Retro Arcade Hub", desc: "A curated collection of classic, browser-based responsive mini-games.", icon: "🕹️", bg: "var(--pastel-purple)", url: "https://example.com/retro-arcade" },
            { title: "SaaS Metrics Tracker", desc: "Monitor monthly recurring revenue, client signups, and business growth analytics.", icon: "📈", bg: "var(--pastel-green)", url: "https://example.com/metrics-tracker" },
            { title: "Shift Scheduler", desc: "Easily calendar daily hours, client service logs, and roster rotations.", icon: "📅", bg: "var(--pastel-peach)", url: "https://example.com/shift-scheduler" },
            { title: "Password Vault", desc: "Securely generate and store complex, localized cryptographic passwords.", icon: "🔒", bg: "var(--pastel-blue)", url: "https://example.com/password-vault" },
            { title: "Markdown Editor", desc: "Write, preview, and export clean rich-text formatting effortlessly.", icon: "📝", bg: "var(--pastel-pink)", url: "https://example.com/markdown-editor" },
            { title: "Resume Builder", desc: "Input professional details to generate instantly polished career profiles.", icon: "💼", bg: "var(--pastel-green)", url: "https://example.com/resume-builder" },
            { title: "Expense Tracker", desc: "Log overhead operational costs, receipts, and structural budgets.", icon: "💰", bg: "var(--pastel-yellow)", url: "https://example.com/expense-tracker" },
            { title: "CRM Contact Log", desc: "Manage client interaction notes, profile histories, and support logs.", icon: "👥", bg: "var(--pastel-purple)", url: "https://example.com/crm-log" },
            { title: "Unit Converter", desc: "Fast conversions between metrics, weights, and digital formats.", icon: "🔄", bg: "var(--pastel-peach)", url: "https://example.com/unit-converter" }
        ];

        const gridContainer = document.getElementById('grid-container');

        // Render loop matching layouts precisely
        showcaseApps.forEach(app => {
            const card = document.createElement('a');
            card.className = 'app-card';
            card.href = app.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.setAttribute('aria-label', `Launch the ${app.title} application in a new tab`);

            card.innerHTML = `
                <div class="icon-wrapper" style="background-color: ${app.bg};">
                    <span class="icon-shape" role="img" aria-hidden="true">${app.icon}</span>
                </div>
                <div>
                    <h2 class="app-title">${app.title}</h2>
                    <p class="app-desc">${app.desc}</p>
                </div>
                <span class="card-btn">Open App</span>
            `;

            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
